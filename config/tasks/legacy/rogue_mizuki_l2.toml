# rogue_mizuki_l2.toml — 文件名保留给当前 runner 内存绑定（l2.rogueTask 重启前仍是这个名字）
#
# 用户 2026-10-11：l-2 水月刷完，换成傀影。正式任务文件是 rogue_phantom_l2.toml
# （accounts.json 已指向它；本文件内容与其一致，避免重启前车道重发仍读到水月）。
# 配装沿用标准：难度3 / 维什戴尔 / 先手必胜 / 借干员+非好友助战 / 不投资。

[[tasks]]
name = "StartUp"
type = "StartUp"
params = { client_type = "YoStarJP", start_game_enabled = true }

[[tasks]]
name = "Roguelike 无限"
type = "Roguelike"
params = {
  theme = "Phantom",
  mode = 0,
  starts_count = 99999,
  difficulty = 3,
  core_char = "维什戴尔",
  roles = "先手必胜",
  use_support = true,
  use_nonfriend_support = true,
  investment_enabled = false,
}
